<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>Nana's Bites — Color System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --ink: #f5f5f5;
      --mute: #a3a3a3;
      --dim: #666666;
      --line: #1a1a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1080px;
      height: 1440px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .board {
      width: 1080px;
      height: 1440px;
      background: #050505;
      padding: 88px 72px 72px;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 72px;
    }

    .kicker {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.42em;
      color: var(--mute);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .title {
      font-size: 42px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      line-height: 1;
    }

    .meta {
      text-align: right;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.8;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 28px 22px;
      flex: 1;
      align-content: start;
    }

    .swatch {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .block {
      height: 292px;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-inline: 4px;
    }

    .name {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .hex {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--mute);
    }

    .role {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .bottom {
      margin-top: auto;
      padding-top: 48px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .roles {
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .sep {
      letter-spacing: 0;
      margin: 0 14px;
      color: #3a3a3a;
    }

    .foot {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--dim);
    }
  </style>
</head>
<body>
  <div class="board">
    <header class="top">
      <div>
        <p class="kicker">Digital Brand Palette</p>
        <h1 class="title">Color System</h1>
      </div>
      <p class="meta">Nana’s Bites<br />Chef Farah Ammar</p>
    </header>

    <section class="grid">
      <article class="swatch">
        <div class="block" style="background:#4B2A63"></div>
        <div class="info">
          <p class="name">Deep Purple</p>
          <p class="hex">#4B2A63</p>
          <p class="role">Primary</p>
        </div>
      </article>
      <article class="swatch">
        <div class="block" style="background:#2D1A3D"></div>
        <div class="info">
          <p class="name">Midnight</p>
          <p class="hex">#2D1A3D</p>
          <p class="role">Text</p>
        </div>
      </article>
      <article class="swatch">
        <div class="block" style="background:#7A5C8E"></div>
        <div class="info">
          <p class="name">Lavender</p>
          <p class="hex">#7A5C8E</p>
          <p class="role">Secondary</p>
        </div>
      </article>
      <article class="swatch">
        <div class="block" style="background:#3D224F"></div>
        <div class="info">
          <p class="name">Dark Soft</p>
          <p class="hex">#3D224F</p>
          <p class="role">Secondary</p>
        </div>
      </article>
      <article class="swatch">
        <div class="block" style="background:#F2E3E1"></div>
        <div class="info">
          <p class="name">Soft Pink</p>
          <p class="hex">#F2E3E1</p>
          <p class="role">Accent</p>
        </div>
      </article>
      <article class="swatch">
        <div class="block" style="background:#FAF9F7"></div>
        <div class="info">
          <p class="name">Off White</p>
          <p class="hex">#FAF9F7</p>
          <p class="role">Surface</p>
        </div>
      </article>
    </section>

    <footer class="bottom">
      <div class="roles">
        <span>Primary</span>
        <span class="sep">/</span>
        <span>Secondary</span>
        <span class="sep">/</span>
        <span>Surface</span>
        <span class="sep">/</span>
        <span>Text</span>
        <span class="sep">/</span>
        <span>Accent</span>
      </div>
      <p class="foot">01 / COLOR</p>
    </footer>
  </div>
</body>
</html>
